services:
  backend_ai:
    build: .
    container_name: dev_highfive_backend_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: pgvector/pgvector:pg16
    container_name: dev_highfive_backend_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: highfive
    volumes:
      - dev_ai_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: dev_highfive_backend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_ai_redis_data:/data

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: dev_highfive_backend_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis
    volumes:
      - dev_ai_redis_insight_data:/data

volumes:
  dev_ai_pgdata:
  dev_ai_redis_data:
  dev_ai_redis_insight_data:
