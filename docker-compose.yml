services:
  backend_ai:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: highfive_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URI: postgresql+asyncpg://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
    volumes:
      - ./src:/app/src
      - ./main.py:/app/main.py
      - ./config:/app/config
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker_service:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: highfive_ai_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URI: postgresql+asyncpg://${DB_USERNAME}:${DB_PASSWORD}@db:5432/${DB_DATABASE}
    volumes:
      - ./src:/app/src
      - ./config:/app/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Utils
  db:
    image: pgvector/pgvector:pg16
    container_name: highfive_ai_db
    restart: unless-stopped
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: highfive_ai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: dev_highfive_redisinsight
    restart: unless-stopped
    ports:
      - "${REDIS_INSIGHT_PORT}:5540"
    depends_on:
      - redis
    volumes:
      - redis_insight_data:/data

volumes:
  pgdata:
  redis_data:
  redis_insight_data:
